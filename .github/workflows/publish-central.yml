name: Publish to Maven Central (Central Portal)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after verification (leave disabled for a safe dry run)
        required: true
        type: boolean
        default: false
      release_version:
        description: Exact version from java/modelarium/pom.xml (required when publishing manually)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: "maven-central-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release revision
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout release revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm revision is releasable
        shell: bash
        run: |
          git fetch origin main --no-tags

          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "Release revision $GITHUB_SHA is not part of the main branch."
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tag must use the form vMAJOR.MINOR.PATCH."
              exit 1
            fi
          elif [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Manual release verification must run from the main branch."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Python for repository checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Confirm Java core version alignment
        run: python scripts/check_version_alignment.py

      - name: Clean, build and test all modules
        run: mvn -B -U clean verify --file pom.xml

  publish:
    name: Sign and publish library
    needs: verify
    if: ${{ github.event_name == 'push' || inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout verified release revision
        uses: actions/checkout@v4

      - name: Set up JDK 21, Maven Central credentials and GPG
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Confirm release version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.release_version }}
        run: |
          PROJECT_VERSION="$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout --file java/modelarium/pom.xml)"

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            EXPECTED_VERSION="${GITHUB_REF_NAME#v}"
          else
            EXPECTED_VERSION="$REQUESTED_VERSION"
            if [[ -z "$EXPECTED_VERSION" ]]; then
              echo "release_version is required when publishing manually."
              exit 1
            fi
          fi

          if [[ "$PROJECT_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "POM version '$PROJECT_VERSION' does not match release version '$EXPECTED_VERSION'."
            exit 1
          fi

      - name: Publish signed library to Maven Central
        run: mvn -B -U -Prelease deploy --file java/modelarium/pom.xml
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
